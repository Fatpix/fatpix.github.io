<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Control | Admin</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #lockscreen {
      position: fixed;
      inset: 0;
      z-index: 9999999;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: opacity 250ms ease;
    }
    #lockscreen.unlocked {
      opacity: 0;
      pointer-events: none;
    }
    .lock-box {
      width: min(100%, 22rem);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    .brand-title {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #888888;
      margin: 0;
    }
    .lock-title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      color: #ffffff;
    }
    .lock-desc {
      font-size: 0.875rem;
      color: #777777;
      margin: -0.5rem 0 0.5rem;
      line-height: 1.4;
    }
    .pin-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .pin-input {
      width: 100%;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: #ffffff;
      font-size: 1.8rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      text-align: center;
      padding: 0.65rem 1rem;
      letter-spacing: 0.4em;
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }
    .pin-input:focus {
      border-color: #ef1111;
      box-shadow: 0 0 0 2px rgba(239, 17, 17, 0.2);
    }
    .pin-input::placeholder {
      letter-spacing: 0.3em;
      color: #444444;
      font-size: 1.4rem;
    }
    .submit-btn {
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 4px;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: background-color 150ms ease, color 150ms ease;
    }
    .submit-btn:hover {
      background: #ef1111;
      color: #ffffff;
    }
    .error-msg {
      font-size: 0.8125rem;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      color: #ef1111;
      min-height: 1.2em;
      margin: 0;
      opacity: 0;
      transition: opacity 150ms ease;
    }
    .error-msg.visible {
      opacity: 1;
    }
    .shake {
      animation: shake 300ms ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
  </style>
</head>
<body>
  <div id="lockscreen">
    <div class="lock-box" id="lockBox">
      <p class="brand-title">FATPIX / FILIPPO ARPE</p>
      <h1 class="lock-title">Studio Control</h1>
      <p class="lock-desc">Area riservata. Inserisci il PIN per accedere al pannello di gestione.</p>
      
      <form class="pin-form" id="pinForm" onsubmit="event.preventDefault(); verifyPin();">
        <input type="password" id="pinInput" class="pin-input" inputmode="numeric" maxlength="8" placeholder="••••" autofocus autocomplete="current-password">
        <button type="submit" class="submit-btn">Sblocca</button>
        <p class="error-msg" id="errorMsg">PIN non valido</p>
      </form>
    </div>
  </div>

  <script>
    (function() {
      var HASH = "17dc3303cd10e0824497a0874a4b86275e63c943e3fefba5f5760959dd525fc2";
      var lockscreen = document.getElementById('lockscreen');
      var pinInput = document.getElementById('pinInput');
      var errorMsg = document.getElementById('errorMsg');
      var lockBox = document.getElementById('lockBox');

      function loadCms() {
        if (document.getElementById('sveltia-script')) return;
        var s = document.createElement('script');
        s.id = 'sveltia-script';
        s.type = 'module';
        s.src = 'https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js';
        document.head.appendChild(s);
      }

      function unlock() {
        lockscreen.classList.add('unlocked');
        setTimeout(function() {
          lockscreen.style.display = 'none';
        }, 300);
        loadCms();
      }

      // Se già sbloccato in questa sessione
      if (sessionStorage.getItem('admin_gate_unlocked') === 'true') {
        unlock();
        return;
      }

      // Hash SHA-256
      async function sha256(str) {
        var buf = new TextEncoder().encode(str);
        var digest = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(digest)).map(function(b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
      }

      window.verifyPin = async function() {
        var entered = pinInput.value.trim();
        if (!entered) return;
        var hash = await sha256(entered);
        if (hash === HASH) {
          sessionStorage.setItem('admin_gate_unlocked', 'true');
          errorMsg.classList.remove('visible');
          unlock();
        } else {
          errorMsg.classList.add('visible');
          lockBox.classList.remove('shake');
          void lockBox.offsetWidth; // trigger reflow
          lockBox.classList.add('shake');
          pinInput.value = '';
          pinInput.focus();
        }
      };

      // Controllo automatico appena si digitano 4 cifre
      pinInput.addEventListener('input', function() {
        if (pinInput.value.length === 4) {
          verifyPin();
        }
      });
    })();

    // ⚡ Auto-compressione intelligente immagini client-side
    (function initImageAutoCompressor() {
      function showToast(msg) {
        var toast = document.getElementById('opt-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'opt-toast';
          toast.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999999;background:#111111;color:#ffffff;border:1px solid #ef1111;padding:0.65rem 1.1rem;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:0.8rem;box-shadow:0 8px 24px rgba(0,0,0,0.6);opacity:0;transition:opacity 200ms ease;pointer-events:none;line-height:1.4;';
          document.body.appendChild(toast);
        }
        toast.textContent = msg;
        toast.style.opacity = '1';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(function() {
          toast.style.opacity = '0';
        }, 4500);
      }

      async function compressFile(file) {
        if (!file) return file;
        var name = (file.name || '').toLowerCase();
        var type = (file.type || '').toLowerCase();
        // Mai comprimere o alterare video, GIF animate o vettoriali SVG
        if (type.startsWith('video/') || name.endsWith('.mp4') || name.endsWith('.webm') || name.endsWith('.mov') || name.endsWith('.ogg')) return file;
        if (type === 'image/gif' || name.endsWith('.gif')) return file;
        if (type.includes('svg') || name.endsWith('.svg')) return file;
        if (!type.startsWith('image/')) return file;
        // Se già sotto i 350 KB, è già ottimale
        if (file.size <= 350 * 1024) return file;

        var oldMb = (file.size / (1024 * 1024)).toFixed(1);

        var img = new Image();
        var url = URL.createObjectURL(file);
        await new Promise(function(resolve, reject) {
          img.onload = resolve;
          img.onerror = reject;
          img.src = url;
        });

        var maxDim = 2000;
        var w = img.naturalWidth || img.width;
        var h = img.naturalHeight || img.height;

        if (w > maxDim || h > maxDim) {
          var ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }

        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);

        var isPngTransparent = false;
        if (file.type === 'image/png') {
          try {
            var pData = ctx.getImageData(0, 0, Math.min(w, 40), Math.min(h, 40)).data;
            for (var i = 3; i < pData.length; i += 4) {
              if (pData[i] < 250) { isPngTransparent = true; break; }
            }
          } catch(e) {}
        }

        var outType = isPngTransparent ? 'image/png' : 'image/jpeg';
        var quality = isPngTransparent ? 0.9 : 0.84;

        var blob = await new Promise(function(resolve) {
          canvas.toBlob(resolve, outType, quality);
        });

        if (!blob || blob.size >= file.size) return file;

        var newExt = outType === 'image/jpeg' ? '.jpg' : '.png';
        var newName = file.name.replace(/\.[^.]+$/, '') + newExt;
        var newFile = new File([blob], newName, { type: outType, lastModified: Date.now() });

        var newKb = Math.round(newFile.size / 1024);
        var savedPct = Math.round((1 - newFile.size / file.size) * 100);
        showToast('⚡ Immagine auto-compressa: ' + oldMb + ' MB → ' + newKb + ' KB (-' + savedPct + '%)');

        return newFile;
      }

      document.addEventListener('change', async function(e) {
        var target = e.target;
        if (!target || target.type !== 'file' || !target.files || !target.files.length) return;
        if (target._compressing) return;

        var file = target.files[0];
        if (!file) return;
        var name = (file.name || '').toLowerCase();
        var type = (file.type || '').toLowerCase();
        if (type.startsWith('video/') || name.endsWith('.mp4') || name.endsWith('.webm') || name.endsWith('.mov') || type === 'image/gif' || name.endsWith('.gif')) return;
        if (!type.startsWith('image/') || file.size <= 350 * 1024) return;

        target._compressing = true;
        try {
          var compressed = await compressFile(file);
          if (compressed !== file) {
            var dt = new DataTransfer();
            dt.items.add(compressed);
            target.files = dt.files;
            target.dispatchEvent(new Event('input', { bubbles: true }));
            target.dispatchEvent(new Event('change', { bubbles: true }));
          }
        } catch(err) {
          console.warn('Auto-compressione bypassata:', err);
        } finally {
          target._compressing = false;
        }
      }, true);
    })();
  </script>
</body>
</html>
